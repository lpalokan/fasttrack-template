name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Bites and the commit check need the commit the branch started from.
          fetch-depth: 0

      # Add your stack's setup and install steps here, for example
      # actions/setup-node, actions/setup-python or actions/setup-go,
      # followed by the install command (npm ci, pip install -e ., go mod download).

      - name: The one definition of green
        run: scripts/check.sh

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/guard.py commit-range "origin/$BASE_REF..HEAD"

      - name: Bites, new tests must fail on the old code
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/bites.sh --base "origin/$BASE_REF"
